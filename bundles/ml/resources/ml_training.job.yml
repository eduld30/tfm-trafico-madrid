resources:
  jobs:
    ml_model_training:
      name: madrid-ml-model-training
      max_concurrent_runs: 1
      timeout_seconds: 3600
      queue:
        enabled: false
      parameters:
        - name: gold_catalog
          default: ""
        - name: labels_delta_version
          default: ""
        - name: features_delta_version
          default: ""
        - name: expected_snapshot_id
          default: ""
        - name: mlflow_experiment_id
          default: ""
        - name: mlflow_dfs_tmp
          default: ""
        - name: code_commit
          default: ""
      tasks:
        - task_key: train_and_evaluate
          environment_key: serverless_ml
          disable_auto_optimization: true
          max_retries: 0
          retry_on_timeout: false
          spark_python_task:
            python_file: ../../../scripts/ml/train_models.py
            parameters:
              - --gold-catalog
              - "{{job.parameters.gold_catalog}}"
              - --labels-delta-version
              - "{{job.parameters.labels_delta_version}}"
              - --features-delta-version
              - "{{job.parameters.features_delta_version}}"
              - --expected-snapshot-id
              - "{{job.parameters.expected_snapshot_id}}"
              - --mlflow-experiment-id
              - "{{job.parameters.mlflow_experiment_id}}"
              - --mlflow-dfs-tmp
              - "{{job.parameters.mlflow_dfs_tmp}}"
              - --code-commit
              - "{{job.parameters.code_commit}}"
      environments:
        - environment_key: serverless_ml
          spec:
            environment_version: "4"
            dependencies:
              - ../../../dist/*.whl
              - lightgbm==4.6.0
