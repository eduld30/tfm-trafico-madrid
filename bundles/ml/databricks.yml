bundle:
  name: madrid-ml
  databricks_cli_version: ">= 0.256.0"

include:
  - resources/*.yml

artifacts:
  default:
    type: whl
    path: ../..
    build: python -m build --wheel
    dynamic_version: true

sync:
  paths:
    - ../..
  include:
    - scripts/ml/train_models.py

variables:
  ml_node_type_id:
    description: "Node type autorizado para el job cluster ML"

targets:
  dev:
    mode: development
    default: true
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
  pro:
    mode: production
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
