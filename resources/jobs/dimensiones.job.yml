resources:
  jobs:
    ingesta_dimensiones:
      name: madrid-ingestion-dimensiones
      description: "Carga manual inicial de las dimensiones Bronze y Silver"
      max_concurrent_runs: 1
      tasks:
        - task_key: brz_dim_distritos
          environment_key: default
          python_wheel_task:
            package_name: madrid_ingestion
            entry_point: madrid-ingestion
            parameters:
              - run
              - --env
              - ${var.environment}
              - --layer
              - bronze
              - --source
              - trafico
              - --dataset
              - dim_distritos
              - --run-id
              - "{{job.run_id}}"
              - --config-root
              - ${workspace.file_path}/conf

        - task_key: slv_dim_distritos
          depends_on:
            - task_key: brz_dim_distritos
          environment_key: default
          python_wheel_task:
