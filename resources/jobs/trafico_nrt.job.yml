resources:
  jobs:
    ingesta_trafico_nrt:
      name: madrid-ingestion-trafico-nrt
      description: "Ingesta manual Bronze y Silver del tráfico NRT"
      max_concurrent_runs: 1
      tasks:
        - task_key: brz_trafico_nrt
          environment_key: default
          python_wheel_task:
            package_name: madrid_ingestion
            entry_point: madrid-ingestion
            parameters:
              - run
              - --env
              - ${var.environment}
              - --layer
              - bronze
              - --source
              - trafico
              - --dataset
              - trafico_nrt
              - --run-id
              - "{{job.run_id}}"
              - --config-root
              - ${workspace.file_path}/conf

        - task_key: slv_trafico_nrt
          depends_on:
            - task_key: brz_trafico_nrt
          environment_key: default
          python_wheel_task:
            package_name: madrid_ingestion
            entry_point: madrid-ingestion
            parameters:
              - run
              - --env
              - ${var.environment}
              - --layer
              - silver
              - --source
              - trafico
              - --dataset
              - trafico_nrt
              - --run-id
              - "{{job.run_id}}"
              - --config-root
              - ${workspace.file_path}/conf

      environments:
        - environment_key: default
          spec:
            environment_version: "4"
            dependencies:
              - ../../dist/*.whl
