resources:
  jobs:
    ingesta_eventos:
      name: madrid-ingestion-eventos
      description: "Ingesta manual Bronze y Silver de eventos culturales"
      max_concurrent_runs: 1
      tasks:
        - task_key: brz_eventos_culturales
          environment_key: default
          python_wheel_task:
            package_name: madrid_ingestion
            entry_point: madrid-ingestion
            parameters:
              - run
              - --env
              - ${var.environment}
              - --layer
              - bronze
              - --source
              - eventos
              - --dataset
              - eventos_culturales
              - --run-id
              - "{{job.run_id}}"
              - --config-root
              - ${workspace.file_path}/conf

        - task_key: slv_eventos_culturales
          depends_on:
            - task_key: brz_eventos_culturales
          environment_key: default
          python_wheel_task:
            package_name: madrid_ingestion
            entry_point: madrid-ingestion
            parameters:
              - run
              - --env
              - ${var.environment}
              - --layer
              - silver
              - --source
              - eventos
              - --dataset
              - eventos_culturales
              - --run-id
              - "{{job.run_id}}"
              - --config-root
              - ${workspace.file_path}/conf

      environments:
        - environment_key: default
          spec:
            environment_version: "4"
            dependencies:
              - ../../dist/*.whl
