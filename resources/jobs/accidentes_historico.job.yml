resources:
  jobs:
    ingesta_accidentes_historico:
      name: madrid-ingestion-accidentes-historico
      description: "Ingesta manual Bronze y Silver del histórico de accidentes"
      max_concurrent_runs: 1
      tasks:
        - task_key: brz_accidentes_historico
          environment_key: default
          python_wheel_task:
            package_name: madrid_ingestion
            entry_point: madrid-ingestion
            parameters:
              - run
              - --env
              - ${var.environment}
              - --layer
              - bronze
              - --source
              - accidentes
              - --dataset
              - accidentes_historico
              - --run-id
              - "{{job.run_id}}"
              - --config-root
              - ${workspace.file_path}/conf

        - task_key: slv_accidentes_historico
          depends_on:
            - task_key: brz_accidentes_historico
          environment_key: default
          python_wheel_task:
            package_name: madrid_ingestion
            entry_point: madrid-ingestion
            parameters:
              - run
              - --env
              - ${var.environment}
              - --layer
              - silver
              - --source
              - accidentes
              - --dataset
              - accidentes_historico
              - --run-id
              - "{{job.run_id}}"
              - --config-root
              - ${workspace.file_path}/conf

      environments:
        - environment_key: default
          spec:
            environment_version: "4"
            dependencies:
              - ../../dist/*.whl
