source: calair
enabled: true

datasets:
  # dim_calair va primero porque se enriquece con el distrito mediante el KML
  # estático del paquete y después la consultan calair_nrt/calair_historico.
  - name: dim_calair
    description: "Dimensión de estaciones de calidad del aire"
    enabled: true
    bronze:
      enabled: true
      format: csv
      source_path: "calair/dim_calair"
      target_path: "calair/dim_calair"
      reader_options: &csv_options
        delimiter: ";"
        header: "true"
        encoding: "UTF-8"
        mode: "PERMISSIVE"
      autoloader_options: &autoloader_options
        schema_evolution_mode: addNewColumns
        rescued_data_column: _rescued_data
      transformations:
        - type: normalize_column_names
    silver:
      enabled: true
      target_path: "calair/dim_calair"
      write_strategy: overwrite
      transformations:
        - type: empty_to_null
          columns:
            - so2
            - co
            - pm10
            - pm2_5
            - o3
            - btx
            - via_clase
            - via_par
            - via_nombre
        - type: parse_date
          source_column: fecha_alta
          target_column: fecha_alta
          format: "dd/MM/yyyy"
        - type: regex_replace
          columns:
            - coordenada_x_etrs89
            - coordenada_y_etrs89
          pattern: ","
          replacement: "."
        - type: cast
          columns:
            codigo: long
            codigo_corto: integer
            altitud: integer
            cod_via: long
            coordenada_x_etrs89: double
            coordenada_y_etrs89: double
            longitud: double
            latitud: double
        - type: trim
          columns:
            - estacion
            - direccion
            - longitud_etrs89
            - latitud_etrs89
            - cod_tipo
            - nom_tipo
            - no2
            - so2
            - co
            - pm10
            - pm2_5
            - o3
            - btx
            - via_clase
            - via_par
            - via_nombre
        - type: assign_district
          station_key: codigo_corto
          longitude_column: longitud
          latitude_column: latitud
          district_code_column: distrito_cod
          district_name_column: distrito_nombre

  - name: dim_calair_magnitudes
    description: "Catálogo estático de magnitudes de calidad del aire"
    enabled: true
    bronze:
      enabled: true
      format: csv
      source_path: "calair/dim_calair_magnitudes"
      target_path: "calair/dim_calair_magnitudes"
      reader_options: *csv_options
      autoloader_options: *autoloader_options
      transformations:
        - type: normalize_column_names
    silver:
      enabled: true
      target_path: "calair/dim_calair_magnitudes"
      write_strategy: overwrite
      transformations:
        - type: cast
          columns:
            cod: integer

  - name: calair_nrt
    description: "Calidad del aire cercana a tiempo real"
    enabled: true
    bronze:
      enabled: true
      format: csv
      source_path: "calair/calair_nrt"
      target_path: "calair/calair_nrt"
      reader_options: *csv_options
      autoloader_options: *autoloader_options
      transformations:
        - type: normalize_column_names
    silver:
      enabled: true
      target_path: "calair/calair_nrt"
      write_strategy: merge
      business_keys:
        - punto_muestreo
        - fecha_hora
      transformations: &hourly_transformations
        - type: hourly_wide_to_long
          year_column: ano
          month_column: mes
          day_column: dia
          value_prefix: h
          validity_prefix: v
          value_column: valor
          validity_column: validez
          timestamp_column: fecha_hora
          hours: 24
          hour_offset: -1
        - type: filter
          condition: "validez = 'V'"
        - type: drop
          columns:
            - ano
            - mes
            - dia
        - type: cast
          columns:
            estacion: integer
            magnitud: integer
        - type: lookup_join
          # estacion coincide con dim_calair.codigo_corto; dim_calair ya contiene
          # el distrito calculado con el KML estático del paquete.
          lookup_table:
            layer: silver
            source: calair
            dataset: dim_calair
          join_type: left
          conditions:
            estacion: codigo_corto
          select:
            distrito_cod: distrito_cod
            distrito_nombre: distrito_nombre
        - type: lookup_join
          lookup_table:
            layer: silver
            source: calair
            dataset: dim_calair_magnitudes
          join_type: left
          conditions:
            magnitud: cod
          select:
            magnitud_nombre: magnitud
            magnitud_abrevia: abrevia
            magnitud_unidad: unidad
        - type: deduplicate
          keys:
            - punto_muestreo
            - fecha_hora
          order_by:
            - column: _ingestion_timestamp
              direction: desc

  - name: calair_historico
    description: "Histórico mensual de calidad del aire con granularidad horaria"
    enabled: true
    bronze:
      enabled: true
      format: csv
      source_path: "calair/calair_historico"
      target_path: "calair/calair_historico"
      reader_options: *csv_options
      autoloader_options: *autoloader_options
      transformations:
        - type: normalize_column_names
    silver:
      enabled: true
      target_path: "calair/calair_historico"
      write_strategy: merge
      business_keys:
        - punto_muestreo
        - fecha_hora
      transformations: *hourly_transformations
