source: accidentes
enabled: true

datasets:
  - name: accidentes_historico
    description: "Histórico mensual de accidentes desde 2019"
    enabled: true
    bronze:
      enabled: true
      format: csv
      source_path: "accidentes/accidentes_historico"
      target_path: "accidentes/accidentes_historico"
      reader_options:
        delimiter: ";"
        header: "true"
        encoding: "UTF-8"
        mode: "PERMISSIVE"
      autoloader_options:
        schema_evolution_mode: addNewColumns
        rescued_data_column: _rescued_data
      transformations:
        - type: normalize_column_names
    silver:
      # No existe un identificador de persona implicada; overwrite conserva
      # filas legítimamente repetidas sin inventar una clave de merge.
      enabled: true
      target_path: "accidentes/accidentes_historico"
      write_strategy: overwrite
      transformations:
        - type: empty_to_null
          columns:
            - num_expediente
            - fecha
            - hora
            - localizacion
            - numero
            - cod_distrito
            - distrito
            - tipo_accidente
            - estado_meteorologico
            - tipo_vehiculo
            - tipo_persona
            - rango_edad
            - sexo
            - cod_lesividad
            - lesividad
            - coordenada_x_utm
            - coordenada_y_utm
            - positiva_alcohol
            - positiva_droga
        - type: filter
          condition: "num_expediente IS NOT NULL"
        - type: parse_timestamp
          source_columns:
            - fecha
            - hora
          target_column: fecha_hora
          format: "dd/MM/yyyy H:mm:ss"
        - type: parse_date
          source_column: fecha
          target_column: fecha
          format: "dd/MM/yyyy"
        - type: regex_replace
          columns:
            - coordenada_x_utm
            - coordenada_y_utm
          pattern: ","
          replacement: "."
        - type: cast
          columns:
            cod_distrito: integer
            cod_lesividad: integer
            coordenada_x_utm: double
            coordenada_y_utm: double
            positiva_droga: integer
        - type: lookup_join
          # cod_distrito ya es el código oficial de distrito: se cruza por
          # número (no por el texto libre "distrito") para evitar problemas
          # de mayúsculas/tildes y obtener el nombre estandarizado.
          lookup_table:
            layer: silver
            source: trafico
            dataset: dim_distritos
          join_type: left
          conditions:
            cod_distrito: cod_dis
          select:
            distrito_normalizado: nombre
        - type: trim
          columns:
            - num_expediente
            - localizacion
            - numero
            - distrito
            - tipo_accidente
            - estado_meteorologico
            - tipo_vehiculo
            - tipo_persona
            - rango_edad
            - sexo
            - lesividad
            - positiva_alcohol
