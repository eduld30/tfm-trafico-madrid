source: meteo
enabled: true

datasets:
  # dim_meteo va primero: meteo_nrt/meteo_historico dependen (vía
  # dim_meteo_distrito, generada aparte por notebooks/dim_distrito_geo.py)
  # de que dim_meteo ya esté en Silver. Con --source meteo (sin --dataset)
  # el motor procesa los datasets en el orden en que aparecen aquí.
  - name: dim_meteo
    description: "Dimensión de estaciones meteorológicas"
    enabled: true
    bronze:
      enabled: true
      format: csv
      source_path: "meteo/dim_meteo"
      target_path: "meteo/dim_meteo"
      reader_options: &csv_options
        delimiter: ";"
        header: "true"
        encoding: "UTF-8"
        mode: "PERMISSIVE"
      autoloader_options: &autoloader_options
        schema_evolution_mode: addNewColumns
        rescued_data_column: _rescued_data
      transformations:
        - type: normalize_column_names
    silver:
      enabled: true
      target_path: "meteo/dim_meteo"
      write_strategy: overwrite
      transformations:
        - type: empty_to_null
          columns:
            - vv_81
            - dv_82
            - t_83
            - hr_86
            - pb_87
            - rs_88
            - p_89
            - cod_via
            - via_par
            - num_via
        - type: regex_replace
          columns:
            - coordenada_x_etrs89
            - coordenada_y_etrs89
          pattern: ","
          replacement: "."
        - type: cast
          columns:
            codigo: long
            codigo_corto: integer
            altitud: integer
            cod_via: long
            coordenada_x_etrs89: double
            coordenada_y_etrs89: double
            longitud: double
            latitud: double
        - type: trim
          columns:
            - estacion
            - direccion
            - longitud_etrs89
            - latitud_etrs89
            - via_clase
            - via_par
            - via_nombre
            - num_via

  - name: dim_magnitudes_meteo
    description: "Catálogo estático de magnitudes meteorológicas"
    enabled: false
    bronze:
      enabled: true
      format: csv
      source_path: "meteo/dim_magnitudes_meteo"
      target_path: "meteo/dim_magnitudes_meteo"
      reader_options: *csv_options
      autoloader_options: *autoloader_options
      transformations:
        - type: normalize_column_names
    silver:
      enabled: true
      target_path: "meteo/dim_magnitudes_meteo"
      write_strategy: overwrite

  - name: meteo_nrt
    description: "Meteorología cercana a tiempo real"
    enabled: true
    bronze:
      enabled: true
      format: csv
      source_path: "meteo/meteo_nrt"
      target_path: "meteo/meteo_nrt"
      reader_options: *csv_options
      autoloader_options: *autoloader_options
      transformations:
        - type: normalize_column_names
    silver:
      enabled: true
      target_path: "meteo/meteo_nrt"
      write_strategy: merge
      business_keys:
        - estacion
        - magnitud
        - fecha_hora
      transformations: &hourly_transformations
        - type: hourly_wide_to_long
          year_column: ano
          month_column: mes
          day_column: dia
          value_prefix: h
          validity_prefix: v
          value_column: valor
          validity_column: validez
          timestamp_column: fecha_hora
          hours: 24
          hour_offset: -1
        - type: filter
          condition: "validez = 'V'"
        - type: drop
          columns:
            - punto_muestreo
            - ano
            - mes
            - dia
        - type: cast
          columns:
            estacion: integer
            magnitud: integer
        - type: lookup_join
          # estacion coincide con dim_meteo_distrito.codigo_corto (el nombre
          # descriptivo de la estación vive en dim_meteo.estacion, un campo
          # distinto). dim_meteo_distrito la genera notebooks/dim_distrito_geo.py.
          lookup_table:
            layer: silver
            source: meteo
            dataset: dim_meteo_distrito
          join_type: left
          conditions:
            estacion: codigo_corto
          select:
            distrito_cod: distrito_cod
            distrito_nombre: distrito_nombre
        - type: deduplicate
          keys:
            - estacion
            - magnitud
            - fecha_hora
          order_by:
            - column: _ingestion_timestamp
              direction: desc

  - name: meteo_historico
    description: "Histórico mensual de meteorología con granularidad horaria"
    enabled: true
    bronze:
      enabled: true
      format: csv
      source_path: "meteo/meteo_historico"
      target_path: "meteo/meteo_historico"
      reader_options: *csv_options
      autoloader_options: *autoloader_options
      transformations:
        - type: normalize_column_names
    silver:
      enabled: true
      target_path: "meteo/meteo_historico"
      write_strategy: merge
      business_keys:
        - estacion
        - magnitud
        - fecha_hora
      transformations: *hourly_transformations
